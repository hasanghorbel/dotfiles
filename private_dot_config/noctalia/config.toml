[accessibility]
ui_scale = 1.2500000111758709

[bar.default]
capsule = true
center = [ "group:g3", "workspaces" ]
end = [ "group:g4", "session" ]
margin_edge = 10
margin_ends = 25
margin_opposite_edge = 5
padding = 12
position = "left"
radius = 16
scale = 1.2500000111758709
start = [ "launcher", "wallpaper", "notifications" ]
thickness = 45
widget_spacing = 10

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "temp", "cpu", "network_tx", "network_rx" ]
    opacity = 1.0
    padding = 8.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "temp", "cpu", "ram", "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
corner_radius_scale = 1.5000000223517418
font_family = "Adwaita Sans"

    [shell.launcher]
    app_grid = true
    categories = false

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Catppuccin"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "kitty", "niri" ]

[wallpaper.default]
path = "/home/archlinux/Pictures/Wallpapers/wallhaven-jey8kq_1920x1080.png"

[wallpaper.last]
path = "/home/archlinux/Pictures/Wallpapers/wallhaven-jey8kq_1920x1080.png"

[wallpaper.monitors.eDP-1]
path = "/home/archlinux/Pictures/Wallpapers/wallhaven-jey8kq_1920x1080.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/archlinux/Pictures/Wallpapers/wallhaven-jey8kq_1920x1080.png"
theme_mode = "dark"
wallpaper_scheme = "soft"

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clock]
timezone = "Africa/Tunis"

[widget.control-center]
enabled = false

[widget.cpu]
scale = 0.90000000000000013

[widget.date]
format = "{:%b %d }"

[widget.media]
enabled = false

[widget.network_rx]
scale = 0.90000000000000013

[widget.network_tx]
scale = 0.90000000000000013

[widget.session]
color = "error"

[widget.spacer_2]
length = 70
type = "spacer"

[widget.taskbar]
hide_empty_workspaces = true

[widget.temp]
scale = 0.90000000000000013

[widget.workspaces]
display = "none"
