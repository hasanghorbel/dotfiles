[accessibility]
ui_scale = 1.2500000111758709

[bar.default]
capsule = true
center = [ "group:g3", "workspaces" ]
end = [ "group:g4", "session" ]
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
padding = 12
position = "top"
radius = 0
radius_bottom_left = 20
radius_bottom_right = 19
scale = 1.2000000104308128
start = [ "launcher", "wallpaper", "notifications" ]
thickness = 30
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "temp", "cpu", "network_tx", "network_rx" ]
    opacity = 1.0
    padding = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "temp", "ram", "cpu", "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

[location]
address = "Sfax, Tunisia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
corner_radius_scale = 1.5000000223517418
font_family = "Noto Sans"

    [shell.launcher]
    app_grid = true
    categories = false

    [shell.panel]
    transparency_mode = "soft"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "kitty", "niri" ]

[wallpaper]
directory = "/home/usr/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/usr/Pictures/Wallpapers/a_foggy_forest_with_trees_and_bushes.png"

    [wallpaper.last]
    path = "/home/usr/Pictures/Wallpapers/a_foggy_forest_with_trees_and_bushes.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/usr/Pictures/Wallpapers/a_foggy_forest_with_trees_and_bushes.png"

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clock]
timezone = "Africa/Tunis"

[widget.control-center]
enabled = false

[widget.cpu]
scale = 0.90000000000000013

[widget.date]
format = "{:%b %d }"

[widget.media]
enabled = false

[widget.network_rx]
enabled = false
scale = 0.90000000000000013

[widget.network_tx]
enabled = false
scale = 0.90000000000000013

[widget.session]
color = "error"

[widget.spacer_2]
length = 70
type = "spacer"

[widget.taskbar]
hide_empty_workspaces = true

[widget.temp]
enabled = false
scale = 0.90000000000000013

[widget.workspaces]
show_labels = false
